name: Daily Merge Proxies

on:
  schedule:
    - cron: "0 */4 * * *"   # каждые 4 часа
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install requests httpx

      - name: Install sing-box
        run: |
          wget https://github.com/SagerNet/sing-box/releases/latest/download/sing-box-linux-amd64.tar.gz
          tar -xzf sing-box-linux-amd64.tar.gz
          sudo mv sing-box /usr/local/bin/
          sudo chmod +x /usr/local/bin/sing-box

      - name: Run merge script (merge_subs.py)
        run: python merge_subs.py

      - name: Run tester (tester.py)
        run: python tester.py

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Принудительно добавляем ВСЁ
          git add -A
          git add subs/ 2>/dev/null || true
          git add tested/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily update $(date +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "✅ Успешно закоммичено"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}